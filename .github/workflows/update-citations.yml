# Daily job that syncs the Google Scholar citation count shown on the
# homepage into content/publications.md. A successful push here triggers the
# main "Deploy Next.js site to Pages" workflow, which rebuilds the site.
# Failures are non-destructive: nothing is committed and the site is untouched.

name: Update citation count

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC (10:00 Beijing)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update citations
        id: update
        env:
          SCHOLAR_USER: "5VqeNC4AAAAJ"
          # Optional: create a repo secret named SERPAPI_KEY to switch from
          # direct scraping to the reliable SerpAPI endpoint automatically.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/update-citations.mjs

      - name: Commit and push if changed
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publications.md
          git commit -m "chore: sync citation count from Google Scholar"
          git push
